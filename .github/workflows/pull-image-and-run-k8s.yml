name: PullImageFromDockerHubAndRunInKubernetes (KinD)

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Docker Hub repository (e.g., username/json2excel)'
        required: true
        type: string
      tag:
        description: 'Image tag to deploy (e.g., latest)'
        required: false
        default: 'latest'
        type: string
      waitForCompletion:
        description: 'Wait for Job completion and upload output.xlsx'
        required: false
        default: true
        type: boolean

jobs:
  deploy_job:
    name: Deploy Job with Docker Hub Image on KinD
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up KinD Cluster
        uses: helm/kind-action@v1.9.0
        with:
          node_image: kindest/node:v1.28.0

      - name: Delete previous job if exists
        run: kubectl delete job json2excel-job --ignore-not-found

      - name: Apply manifests with Docker Hub image
        env:
          IMAGE: ${{ inputs.repository }}:${{ inputs.tag }}
        run: |
          sed "s|image: json2excel:latest|image: ${IMAGE}|" k8s/job.yaml | kubectl apply -f -

      - name: Wait for Job completion
        if: inputs.waitForCompletion == 'true'
        run: kubectl wait --for=condition=complete job/json2excel-job --timeout=600s

      - name: Get logs
        if: inputs.waitForCompletion == 'true'
        run: kubectl logs job/json2excel-job --tail=-1

      - name: Copy output.xlsx from pod
        if: inputs.waitForCompletion == 'true'
        run: |
          POD=$(kubectl get pods -l job-name=json2excel-job -o jsonpath='{.items[0].metadata.name}')
          kubectl cp "$POD:/data/output.xlsx" ./output.xlsx || echo "No output.xlsx found"

      - name: Upload output.xlsx artifact
        if: inputs.waitForCompletion == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: k8s-output
          path: output.xlsx
          if-no-files-found: warn


