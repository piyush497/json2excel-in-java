name: BuildAndPushToDockerHub

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Docker Hub repository (e.g., username/json2excel)'
        required: true
        type: string
      tag:
        description: 'Primary tag to push (e.g., latest)'
        required: false
        default: 'latest'
        type: string
      addShaTag:
        description: 'Also push image tagged with the commit SHA'
        required: false
        default: true
        type: boolean

jobs:
  dockerhub_build_push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REPO: ${{ inputs.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare tags
        id: prep
        run: |
          TAGS="${REPO}:${TAG}"
          if [ "${{ inputs.addShaTag }}" = "true" ]; then
            TAGS="$TAGS,${REPO}:${GITHUB_SHA}"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.prep.outputs.tags }}


