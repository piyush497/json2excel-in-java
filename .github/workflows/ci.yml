name: CI - Build, Test, Docker, K8s Job

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build_test:
    name: Build and Test (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn -B -e -DskipTests=false verify

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts
          path: target/*.jar

  docker_build_push:
    name: Docker Build and Push
    needs: build_test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Set IMAGE output
        id: image
        run: |
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Upload image name
        uses: actions/upload-artifact@v4
        with:
          name: image-ref
          path: |
            /dev/null
        continue-on-error: true

  k8s_deploy_job:
    name: Deploy to Kubernetes Job and Retrieve Output
    needs: docker_build_push
    if: github.event_name == 'push' && success() && secrets.KUBE_CONFIG != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${KUBE_CONFIG}" > $HOME/.kube/config
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      - name: Ensure namespace
        run: |
          kubectl get ns default || true

      - name: Delete previous job if exists
        run: kubectl delete job json2excel-job --ignore-not-found

      - name: Apply manifests with image override
        env:
          IMAGE: ${{ needs.docker_build_push.outputs.image }}
        run: |
          bash -c 'sed "s|image: json2excel:latest|image: ${IMAGE}|" k8s/job.yaml | kubectl apply -f -'

      - name: Wait for Job completion
        run: kubectl wait --for=condition=complete job/json2excel-job --timeout=600s

      - name: Get logs
        run: kubectl logs job/json2excel-job --tail=-1

      - name: Copy output.xlsx from pod
        run: |
          POD=$(kubectl get pods -l job-name=json2excel-job -o jsonpath='{.items[0].metadata.name}')
          kubectl cp $POD:/data/output.xlsx ./output.xlsx || echo "No output.xlsx found"

      - name: Upload output.xlsx artifact
        uses: actions/upload-artifact@v4
        with:
          name: k8s-output
          path: output.xlsx
          if-no-files-found: warn


